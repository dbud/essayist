name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target: prod (live worker) or preview (workers.dev)"
        type: choice
        options: [prod, preview]
        default: "prod"

permissions:
  contents: read

# Checks run on every branch push. Pushes to main ship the live
# environment after the checks pass; other branch pushes ship a
# per-branch preview to workers.dev. A manual run deploys prod (default)
# or a preview, from any ref.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check core and worker
        run: pnpm check

      - name: Test core
        run: pnpm test

      - name: Build worker
        run: pnpm build

      - name: Check favicon assets
        run: pnpm -C packages/worker run favicon:check

  worker-deploy:
    needs: checks
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy worker
        run: pnpm -C packages/worker run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  worker-preview:
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/main' &&
      !startsWith(github.ref_name, 'dependabot/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
    runs-on: ubuntu-latest
    concurrency:
      group: worker-preview-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Slug
        id: slug
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/-+/-/g; s/^-+//; s/-+$//' | cut -c1-25 | sed -E 's/-+$//')
          if [ -z "$slug" ]; then slug=preview; fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Preview upload
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          pnpm -C packages/worker run deploy-preview --tag "$SLUG" --message "$GITHUB_SHA" --preview-alias "$SLUG" > upload.log 2>&1
          url=$(grep -oE 'https://[a-z0-9-]+\.workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          tail -5 upload.log >> "$GITHUB_STEP_SUMMARY"

      - name: Preview URL
        run: |
          echo "Preview URL for ${{ github.ref_name }}: ${{ steps.upload.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
