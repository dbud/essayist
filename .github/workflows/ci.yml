name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target: prod (live worker)"
        type: choice
        options: [prod]
        default: "prod"

permissions:
  contents: read

# Checks run on every branch push. Pushes to main ship the live environment after the checks pass;
# other branches run checks only. A manual run deploys prod from any ref.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check core and worker
        run: pnpm check

      - name: Test core
        run: pnpm test

      - name: Build worker
        run: pnpm build

      - name: Check favicon assets
        run: pnpm -C packages/worker run favicon:check

  worker-deploy:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the sentry dsn secret
        run: pnpm -C packages/worker exec wrangler secret list | grep -q SENTRY_DSN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker
        run: pnpm -C packages/worker run deploy -- --var SENTRY_RELEASE:$GITHUB_SHA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
