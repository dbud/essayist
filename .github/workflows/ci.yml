name: CI

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pnpm:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check core and worker
        run: pnpm check

      - name: Test core
        run: pnpm test

      - name: Build worker
        run: pnpm build
