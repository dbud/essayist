name: CI

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # The deno world: web (Fresh on Deno Deploy), kvctl, wasm, and the
  # Deploy build + release. Frozen during the Cloudflare migration, so
  # this job runs on main pushes only; migration branches are gated by
  # the pnpm job below.
  #
  # Before this branch merges back: its deno.jsonc change (nodeModulesDir
  # removed, deno now resolves types from the global cache) surfaced three
  # stale diagnostics in web/patches (PNG.sync typing, plus two now-unused
  # @ts-expect-error Workarounds for deno issue 30850). Restore
  # nodeModulesDir auto or fix the diagnostics so this job is green on
  # main again.
  deno:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install dependencies
        run: deno install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Verify rust formatting
        run: cargo fmt --check

      - name: Rust linter
        run: cargo clippy --lib --tests -- -D warnings

      - name: Build wasm package
        run: deno task wasm:build

      - name: Run checks
        run: deno task check

      - name: Run tests
        run: deno test -A --unstable-kv

      - name: Favicon freshness
        run: deno task -f web favicon:check

      # The deploy packer skips gitignored paths, so the artifact is
      # staged outside the workspace before uploading.
      - name: Build
        run: deno task -f web build

      - name: Stage build artifact
        run: |
          mkdir -p "$RUNNER_TEMP/artifact"
          cp -R packages/web/_fresh/. "$RUNNER_TEMP/artifact/"

      - name: Deploy to Deno Deploy
        working-directory: ${{ runner.temp }}/artifact
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy --org dbud --app essayist --prod --json --non-interactive .

  # The active world: core and worker on the pnpm workspace. Gates every
  # push and PR, including migration branches.
  pnpm:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check core and worker
        run: pnpm check

      - name: Test core
        run: pnpm test

      - name: Build worker
        run: pnpm build
