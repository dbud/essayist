version: 2
updates:
  # Deno workspace: root, packages/web, packages/core
  - package-ecosystem: "deno"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "vite"
        versions: [">=8"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      lexical:
        patterns:
          - "lexical"
          - "@lexical/*"

  - package-ecosystem: "cargo"
    directory: "/crates/wasm"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
